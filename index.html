<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elsewhere</title>
    <style>
      :root {
        --bg: #ffffff;
        --frame: #f2f2f2;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        overflow: hidden;
      }

      .stage {
        width: min(82vw, 1100px);
        height: min(72vh, 720px);
        display: grid;
        place-items: center;
        padding: clamp(32px, 7vh, 96px) clamp(32px, 7vw, 110px);
      }

      .art {
        width: min(100%, 920px);
        max-width: 100%;
        opacity: 0;
        animation: fadeInBreath 7s ease-in-out infinite alternate;
        transform-origin: center;
        will-change: transform, opacity;
      }

      .art img {
        display: block;
        width: 100%;
        height: auto;
      }

      @keyframes fadeInBreath {
        0% {
          opacity: 0;
          transform: scale(0.96);
        }
        18% {
          opacity: 1;
          transform: scale(0.985);
        }
        40% {
          opacity: 1;
          transform: scale(1.01);
        }
        58% {
          opacity: 1;
          transform: scale(1.025);
        }
        78% {
          opacity: 1;
          transform: scale(1.012);
        }
        100% {
          opacity: 1;
          transform: scale(1.03);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Centered artwork">
      <div class="art">
        <img src="j2xrx01.svg" alt="Elsewhere artwork" />
      </div>
    </main>
  </body>
</html>
