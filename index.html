<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>elsewhere</title>
  <meta name="description" content="elsewhere is a quiet space at the edge of things.">
  <style>
    :root {
      --black: #000;
      --white: #fff;
      --ash: #777;
      --mist: #ccc;
      --line: rgba(255,255,255,.18);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--black); }
    body {
      color: var(--white);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .page { min-height: 100vh; position: relative; overflow: hidden; }
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse at 50% 82%, #252525 0%, #090909 42%, #000 78%);
      pointer-events: none;
    }

    .topbar {
      align-items: center;
      display: flex;
      justify-content: space-between;
      left: 0;
      padding: 28px 42px;
      position: absolute;
      right: 0;
      top: 0;
      z-index: 4;
    }
    .micro-label, .topbar a, .scene-label, .scene-index {
      color: var(--ash);
      font-size: 10px;
      letter-spacing: .2em;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
    }
    .topbar a { color: var(--mist); transition: color .3s ease; }
    .topbar a:hover { color: var(--white); }

    .intro {
      align-items: center;
      display: flex;
      flex-direction: column;
      left: 0;
      position: absolute;
      right: 0;
      text-align: center;
      top: 17vh;
      z-index: 2;
    }
    .wordmark {
      background: #b8b8b8;
      line-height: 0;
      mix-blend-mode: screen;
      width: min(74vw, 760px);
    }
    .wordmark img {
      display: block;
      height: auto;
      width: 100%;
    }
    .wordmark-rule { background: var(--white); height: 1px; margin-top: 26px; opacity: .8; width: min(280px, 42vw); }
    .descriptor {
      color: var(--mist);
      font-size: 12px;
      letter-spacing: .28em;
      margin: 20px 0 0 .28em;
      text-transform: uppercase;
    }

    .scene-wrap { inset: 29vh 0 0; position: absolute; z-index: 3; }
    .scene-wrap canvas { display: block; height: 100%; width: 100%; }
    .scene-label { bottom: 33px; left: 42px; position: absolute; z-index: 2; }
    .scene-index { bottom: 33px; position: absolute; right: 42px; z-index: 2; }
    .scene-label::before { background: var(--ash); content: ""; display: inline-block; height: 1px; margin: 0 12px 3px 0; width: 30px; }

    .bottom-copy {
      bottom: 29px;
      color: var(--mist);
      font-size: 12px;
      left: 50%;
      letter-spacing: .08em;
      line-height: 1.5;
      max-width: 220px;
      position: absolute;
      text-align: center;
      transform: translateX(-50%);
      z-index: 2;
    }
    .bottom-copy span { color: var(--ash); display: block; font-size: 9px; letter-spacing: .2em; margin-bottom: 7px; text-transform: uppercase; }

    .info-panel {
      background: rgba(10,10,10,.94);
      border: 1px solid var(--line);
      bottom: 28px;
      max-width: 340px;
      opacity: 0;
      padding: 25px 26px 26px;
      pointer-events: none;
      position: absolute;
      right: 42px;
      transform: translateY(18px);
      transition: opacity .4s ease, transform .4s ease;
      width: calc(100% - 84px);
      z-index: 5;
    }
    .info-panel.is-open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .info-panel h2 { font-size: 20px; font-weight: 400; letter-spacing: -.03em; margin: 0 0 10px; }
    .info-panel p { color: var(--mist); font-size: 12px; line-height: 1.7; margin: 0; }
    .close-panel { background: none; border: 0; color: var(--ash); cursor: pointer; font-size: 18px; padding: 0; position: absolute; right: 16px; top: 13px; }
    .close-panel:hover { color: var(--white); }

    @media (max-width: 640px) {
      .topbar { padding: 22px 20px; }
      .intro { top: 18vh; }
      .scene-wrap { top: 34vh; }
      .scene-label { bottom: 20px; left: 20px; }
      .scene-index { bottom: 20px; right: 20px; }
      .bottom-copy { bottom: 19px; font-size: 10px; }
      .info-panel { bottom: 70px; right: 20px; width: calc(100% - 40px); }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <span class="micro-label">Bordo</span>
      <a href="#scene" id="explore-link">Explore</a>
    </header>

    <section class="intro" aria-label="elsewhere introduction">
      <div class="wordmark">
        <img src="title.svg" alt="elsewhere">
      </div>
      <div class="wordmark-rule"></div>
      <p class="descriptor">subtitle</p>
    </section>

    <section class="scene-wrap" id="scene" aria-label="Interactive mountain scene">
      <div class="scene-label">else-minded</div>
      <div class="scene-index">01 / 02</div>
      <div class="bottom-copy"><span>study</span>cryptic concentric circles</div>
      <canvas id="canvas" aria-label="A rotating low-poly mountain with a hut and Victor"></canvas>
    </section>

    <aside class="info-panel" id="info-panel" aria-live="polite">
      <button class="close-panel" id="close-panel" type="button" aria-label="Close information">×</button>
      <h2 id="panel-title">the space elsewhere</h2>
      <p id="panel-copy">a room above the weather.</p>
    </aside>
  </main>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

    // Scene: the container for every 3D object, light, and camera in the experience.
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 11, 26);

    // Camera: a perspective view positioned low enough to keep the mountain on the horizon.
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
    camera.position.set(0, 2.7, 10.5);
    camera.lookAt(0, 0.4, 0);

    // Renderer: draws the scene into the canvas with transparent pixels over the CSS atmosphere.
    const canvas = document.querySelector("#canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // Lighting: soft ambient fill plus a directional key light creates the graphic grey planes.
    scene.add(new THREE.HemisphereLight(0xffffff, 0x111111, 1.4));
    const keyLight = new THREE.DirectionalLight(0xffffff, 3.1);
    keyLight.position.set(-4, 8, 5);
    scene.add(keyLight);

    const world = new THREE.Group();
    world.position.y = -1.25;
    scene.add(world);

    // The mountain is intentionally procedural. Replace these geometries with a GLTF/GLB model
    // by importing GLTFLoader from three/examples/jsm/loaders and adding loader.load(url, callback).
    const mountainMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, flatShading: true, roughness: 1 });
    const mountain = new THREE.Mesh(new THREE.ConeGeometry(4.7, 5.4, 7), mountainMaterial);
    mountain.rotation.y = 0.35;
    mountain.position.y = 1.25;
    mountain.scale.set(1.22, 1, .82);
    world.add(mountain);

    const snow = new THREE.Mesh(new THREE.ConeGeometry(1.6, 1.35, 7), new THREE.MeshStandardMaterial({ color: 0xcccccc, flatShading: true, roughness: 1 }));
    snow.position.set(0, 3.28, 0);
    snow.rotation.y = 0.35;
    snow.scale.set(1.12, 1, .78);
    world.add(snow);

    // A tiny landing plane gives the models a visual base without adding a literal ground.
    const ridge = new THREE.Mesh(new THREE.CircleGeometry(4.7, 7), new THREE.MeshStandardMaterial({ color: 0x111111, flatShading: true }));
    ridge.rotation.x = -Math.PI / 2;
    ridge.position.y = -1.43;
    ridge.scale.set(1.15, .85, 1);
    world.add(ridge);

    function makeInteractive(object, label) {
      object.userData.interactive = true;
      object.userData.label = label;
      object.userData.baseScale = object.scale.clone();
      return object;
    }

    // Hut: simple roof and cabin primitives keep the silhouette legible at a distance.
    const hut = new THREE.Group();
    hut.position.set(-1.48, 2.22, .08);
    const hutBody = new THREE.Mesh(new THREE.BoxGeometry(.72, .52, .62), new THREE.MeshStandardMaterial({ color: 0x777777, roughness: .9 }));
    hutBody.position.y = .26;
    hut.add(hutBody);
    const hutRoof = new THREE.Mesh(new THREE.ConeGeometry(.57, .48, 4), new THREE.MeshStandardMaterial({ color: 0x111111, flatShading: true }));
    hutRoof.position.y = .76;
    hutRoof.rotation.y = Math.PI / 4;
    hut.add(hutRoof);
    const hutWindow = new THREE.Mesh(new THREE.PlaneGeometry(.16, .16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    hutWindow.position.set(0, .3, .316);
    hut.add(hutWindow);
    world.add(makeInteractive(hut, "hut"));

    // Victor: a minimal two-part figure, separated from the hut on the opposite ridge.
    const victor = new THREE.Group();
    victor.position.set(1.35, 2.1, .15);
    const victorBody = new THREE.Mesh(new THREE.CylinderGeometry(.13, .18, .5, 6), new THREE.MeshStandardMaterial({ color: 0xcccccc, flatShading: true }));
    victorBody.position.y = .25;
    victor.add(victorBody);
    const victorHead = new THREE.Mesh(new THREE.SphereGeometry(.16, 8, 6), new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true }));
    victorHead.position.y = .62;
    victor.add(victorHead);
    const victorStaff = new THREE.Mesh(new THREE.CylinderGeometry(.018, .018, .78, 5), new THREE.MeshBasicMaterial({ color: 0x777777 }));
    victorStaff.position.set(.23, .3, 0);
    victorStaff.rotation.z = -.18;
    victor.add(victorStaff);
    world.add(makeInteractive(victor, "victor"));

    // Raycaster: converts the pointer's 2D position into a ray through the 3D scene.
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hovered = null;
    let targetCameraZ = 10.5;
    const interactiveObjects = [hut, victor];

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      camera.aspect = bounds.width / bounds.height;
      camera.updateProjectionMatrix();
      renderer.setSize(bounds.width, bounds.height, false);
    }

    // Mouse listeners: normalize the pointer to -1..1, then check object intersections.
    function updatePointer(event) {
      const bounds = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
      pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
    }
    canvas.addEventListener("pointermove", (event) => {
      updatePointer(event);
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(interactiveObjects, true)[0];
      const next = hit ? hit.object.parent : null;
      if (next !== hovered) {
        hovered = next;
        canvas.style.cursor = hovered ? "pointer" : "default";
      }
    });
    canvas.addEventListener("pointerleave", () => { hovered = null; canvas.style.cursor = "default"; });
    canvas.addEventListener("click", () => {
      if (hovered) openPanel(hovered.userData.label);
    });

    // Animation loop: rotate the world continuously and ease every hover/camera transition.
    const clock = new THREE.Clock();
    function animate() {
      const elapsed = clock.getElapsedTime();
      world.rotation.y = elapsed * 0.075;
      for (const object of interactiveObjects) {
        const scale = object.userData.baseScale.clone().multiplyScalar(object === hovered ? 1.12 + Math.sin(elapsed * 5) * .025 : 1);
        object.scale.lerp(scale, .12);
      }
      camera.position.z += (targetCameraZ - camera.position.z) * .04;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    resize();
    window.addEventListener("resize", resize);
    animate();

    // Swap-in note: SVG paths can be loaded as textures or converted with SVGLoader when a
    // future identity mark needs to become part of the 3D scene.
    const panel = document.querySelector("#info-panel");
    const panelTitle = document.querySelector("#panel-title");
    const panelCopy = document.querySelector("#panel-copy");
    function openPanel(label) {
      if (label === "hut") {
        panelTitle.textContent = "The space elsewhere";
        panelCopy.textContent = "A small room above the weather. Come for the silence, stay for the view.";
        targetCameraZ = 9.2;
      } else {
        panelTitle.textContent = "Victor";
        panelCopy.textContent = "He knows the long way up. Victor keeps watch over the ridge and the room beyond it.";
        targetCameraZ = 9.8;
      }
      panel.classList.add("is-open");
    }
    document.querySelector("#close-panel").addEventListener("click", () => {
      panel.classList.remove("is-open");
      targetCameraZ = 10.5;
    });
    document.querySelector("#explore-link").addEventListener("click", (event) => {
      event.preventDefault();
      document.querySelector("#scene").scrollIntoView({ behavior: "smooth" });
    });
  </script>
</body>
</html>
